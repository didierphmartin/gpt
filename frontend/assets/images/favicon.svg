<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)"/>

  <!-- Chat bubble -->
  <path d="M16 20 C16 16, 20 12, 26 12 L38 12 C44 12, 48 16, 48 20 L48 32 C48 36, 44 40, 38 40 L30 40 L22 48 L22 40 L20 40 C16 40, 16 36, 16 32 Z"
        fill="white" opacity="0.95"/>

  <!-- AI brain/circuit dots representing intelligence -->
  <circle cx="26" cy="26" r="3" fill="url(#bubbleGrad)"/>
  <circle cx="38" cy="26" r="3" fill="url(#bubbleGrad)"/>
  <circle cx="32" cy="32" r="2.5" fill="url(#bubbleGrad)"/>

  <!-- Connecting lines for neural network effect -->
  <line x1="26" y1="26" x2="32" y2="32" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="38" y1="26" x2="32" y2="32" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="26" y1="26" x2="38" y2="26" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
</svg>
