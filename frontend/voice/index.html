  <!-- PWA Window Sizing - resize to content width when running as standalone app -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Check if running as installed PWA (not in browser)
      const isStandalone = window.matchMedia("(display-mode: standalone)").matches
                        || window.navigator.standalone === true;

      if (isStandalone) {
        // Resize window to match max-w-4xl (896px) + some padding
        const preferredWidth = 920;
        const preferredHeight = window.screen.availHeight * 0.9;

        window.resizeTo(preferredWidth, preferredHeight);
        // Center the window
        const left = (window.screen.availWidth - preferredWidth) / 2;
        const top = (window.screen.availHeight - preferredHeight) / 2;
        window.moveTo(left, top);
      }
    });
  </script>
