<!doctype html>
<meta charset="utf-8">
<title>md round-trip</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/dist/toastui-editor.min.css">
<!-- the UMD build needs prosemirror globals; the jsDelivr +esm build bundles them -->
<script type="module">
  import Editor from "https://cdn.jsdelivr.net/npm/@toast-ui/editor@3.2.2/+esm";

  // ---- fidelity fixes, each switchable: cfg = { hr, text, tableDelim, listIndent, sanitizer, html, softbreak, deepHeading } ----

  // Escape what would change meaning when the text is parsed again - and only that. Toast's own common_escape
  // also escapes intra-word _, "1." in a heading, "-" "," "." in prose, ...
  //  ctx.blockStart: the text starts a line of a paragraph (so a block marker would be live there)
  //  ctx.inTable: inside a table cell (| must be escaped, block markers do not apply)
  var PUNCT = '!"#$%&\'()*+,\\-./:;<=>?@\\[\\]\\\\^_`{|}~';
  function minimalEscape(text, ctx) {
    var t = text;
    // a literal backslash that would otherwise escape the next character (or hard-break at the end of a line)
    t = t.replace(new RegExp('\\\\(?=[' + PUNCT + ']|$)', 'g'), '\\\\');
    t = t.replace(/[*~`\[\]]/g, '\\$&');                                         // emphasis, strike, code, link brackets
    t = t.replace(/(^|[^\p{L}\p{N}])_|_(?=[^\p{L}\p{N}]|$)/gu, function (m) { return m.replace('_', '\\_'); }); // _ at a word edge
    t = t.replace(/<(?=[A-Za-z\/!?])/g, '\\<');                                  // would open a tag / autolink / comment
    t = t.replace(/&(?=#?\w+;)/g, '\\&');                                        // would be read as an entity
    if (ctx.inTable) t = t.replace(/\|/g, '\\|');
    if (ctx.blockStart && !ctx.inTable) {
      t = t.replace(/^ {2,}/, ' ');                                              // 4+ spaces would be an indented code block
      t = t.replace(/^(\s?)(#{1,6})(?=[ \t]|$)/, '$1\\$2');                      // ATX heading
      t = t.replace(/^(\s?)([-+])(?=[ \t]|$)/, '$1\\$2');                        // bullet / rule
      t = t.replace(/^(\s?)(-{2,}|={1,})\s*$/, function (m, sp, run) { return sp + '\\' + run; }); // rule / setext underline
      t = t.replace(/^(\s?)>/, '$1\\>');                                         // blockquote
      t = t.replace(/^(\s?)(\d{1,9})([.)])(?=[ \t]|$)/, '$1$2\\$3');             // ordered list
    }
    return t;
  }

  function applyFixes(ed, cfg) {
    var nt = ed.convertor.toMdConvertors.nodeTypeConvertors;
    // Toast turns on disallowDeepHeading: "> ## H" and "- ## H" become literal text. Allow headings there.
    if (cfg.deepHeading) ed.toastMark.parser.options.disallowDeepHeading = false;
    if (cfg.text) {
      var baseText = nt.text;
      nt.text = function (state, info) {
        var node = info.node, marks = node.marks || [];
        if (marks.some(function (m) { return m.type.name === 'link'; })) return baseText(state, info);
        var parent = info.parent ? info.parent.type.name : '';
        var lines = (node.text || '').split('\n');
        for (var i = 0; i < lines.length; i++) {
          state.write();
          var blockStart = parent === 'paragraph' && (i > 0 || info.lineStart || info.index === 0);
          state.result += minimalEscape(lines[i], { inTable: state.inTable, blockStart: blockStart });
          if (i !== lines.length - 1) state.result += '\n';
        }
      };
    }
    if (cfg.html) {
      // unknown inline tags (<path>, <name>, ...) are silently dropped by the md->wysiwyg converter: keep them as text
      var tw = ed.convertor.toWwConvertors, baseHtml = tw.htmlInline;
      tw.htmlInline = function (state, node, ctx) {
        var top = state.stack[state.stack.length - 1];
        var before = [state.stack.length, top.content.length, state.marks];
        baseHtml(state, node, ctx);
        var t2 = state.stack[state.stack.length - 1];
        if (state.stack.length === before[0] && t2.content.length === before[1] && state.marks === before[2]) state.addText(node.literal);
      };
    }
    if (cfg.softbreak) {
      // A line break inside **bold** / *emphasis* / a link is dropped by md->wysiwyg ("one\nassistant" -> "oneassistant"),
      // and a "\n" kept inside a marked text node is truncated by the wysiwyg->md writer (its whitespace-expelling regex
      // is single-line). So: keep the "\n" in the document, swap it for a private-use placeholder just for serialisation,
      // and write the placeholder as a real line break (with the current quote / list prefix).
      var tw2 = ed.convertor.toWwConvertors, baseSoft = tw2.softbreak;
      tw2.softbreak = function (state, node, ctx) {
        if (node.parent && node.parent.type !== 'paragraph') state.addText('\n');
        else baseSoft(state, node, ctx);
      };
      // hard break (two trailing spaces / backslash): the document has no node for it and Toast drops it ("a\nb" -> "ab").
      // Keep it as two trailing spaces before the same split a soft break makes.
      tw2.linebreak = function (state, node, ctx) {
        if (node.parent && node.parent.type !== 'paragraph') state.addText('  \n');
        else { state.addText('  '); baseSoft(state, node, ctx); }
      };
      var prevText = nt.text, PH = String.fromCharCode(0xE000);
      nt.text = function (state, info) {
        var t = info.node.text || '';
        if (t.indexOf(PH) < 0) return prevText(state, info);
        t.split(PH).forEach(function (seg, i) {
          if (i) state.result += '\n';
          if (seg) prevText(state, { node: info.node.type.schema.text(seg, info.node.marks), parent: info.parent, index: info.index, lineStart: i > 0 });
          else state.write();
        });
      };
      var baseToMd = ed.convertor.toMarkdownText.bind(ed.convertor);
      var swap = function (n) {
        if (n.isText) return n.marks.length && n.text.indexOf('\n') >= 0 ? n.type.schema.text(n.text.split('\n').join(PH), n.marks) : n;
        if (!n.content.size) return n;
        var kids = []; n.content.forEach(function (c) { kids.push(swap(c)); });
        return n.copy(n.content.constructor.fromArray(kids));
      };
      ed.convertor.toMarkdownText = function (doc) {
        // the placeholder is a private-use character that does not occur anywhere in this document
        var all = doc.textContent, cp = 0xE000;
        while (all.indexOf(String.fromCharCode(cp)) >= 0) cp++;
        PH = String.fromCharCode(cp);
        return baseToMd(swap(doc));
      };
    }
    if (cfg.listIndent) {
      // continuation lines indented by the marker width, not a fixed 4 spaces
      nt.bulletList = function (state, info) {
        state.convertList(info.node, '  ', function () { return '- '; });
      };
      nt.orderedList = function (state, info) {
        var start = info.node.attrs.order || 1;
        state.convertList(info.node, ' '.repeat(String(start).length + 2), function (i) { return (start + i) + '. '; });
      };
    }
  }

  function buildOptions(cfg) {
    var o = {};
    var cmr = {};
    if (cfg.hr) cmr.thematicBreak = function () { return { delim: '---' }; };
    if (cfg.tableDelim) cmr.tableHead = function (info) {
      var row = info.node.firstChild, d = '';
      if (row) row.forEach(function (c) {
        var a = c.attrs.align;
        d += '| ' + (a === 'left' ? ':---' : a === 'right' ? '---:' : a === 'center' ? ':---:' : '---') + ' ';
      });
      return { delim: d };
    };
    if (Object.keys(cmr).length) o.customMarkdownRenderer = cmr;
    if (cfg.sanitizer) o.customHTMLSanitizer = function (html) { return html; };
    return o;
  }

  function make(md, cfg) {
    var el = document.getElementById('ed');
    el.innerHTML = '';
    var ed = new Editor(Object.assign({
      el: el, height: '400px', initialEditType: 'markdown', previewStyle: 'tab',
      usageStatistics: false, initialValue: md
    }, buildOptions(cfg || {})));
    applyFixes(ed, cfg || {});
    return ed;
  }

  // markdown -> WYSIWYG -> markdown
  window.roundtrip = function (md, cfg) {
    try { return rt1(md, cfg); } catch (e) { return { error: String(e && e.message || e) }; }
  };
  function rt1(md, cfg) {
    var ed = make(md, cfg);
    ed.setMarkdown(md);
    ed.changeMode('wysiwyg', true);
    ed.changeMode('markdown', true);
    var out = ed.getMarkdown();
    ed.destroy();
    return out;
  }

  // same, but append a word to the first top-level paragraph in WYSIWYG before converting back
  window.roundtripEdit = function (md, cfg, word) {
    try { return edit1(md, cfg, word); } catch (e) { return { error: String(e && e.message || e) }; }
  };
  function edit1(md, cfg, word) {
    var ed = make(md, cfg);
    ed.setMarkdown(md);
    ed.changeMode('wysiwyg', true);
    var view = ed.wwEditor.view, doc = view.state.doc, pos = null;
    doc.forEach(function (n, off) {
      if (pos === null && n.type.name === 'paragraph' && n.content.size > 0) pos = off + n.nodeSize - 1;
    });
    if (pos === null) { ed.destroy(); return null; }
    view.dispatch(view.state.tr.insertText(word, pos));
    ed.changeMode('markdown', true);
    var out = ed.getMarkdown();
    ed.destroy();
    return out;
  }
  window.ready = true;
</script>
<div id="ed"></div>
