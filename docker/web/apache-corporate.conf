# The login service relies on its .htaccess rewrites (root → frontend/index.php,
# API → backend/index.php), so it needs AllowOverride like gpt.
<Directory /var/www/html/login>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
<Directory /var/www/html/gpt_admin>
    Options -Indexes
    Require all granted
</Directory>
