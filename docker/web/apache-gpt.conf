# The app lives at /gpt because frontend/assets/js/api-config.js hardcodes
# /gpt/backend/api/v1 as the same-origin default and documents itself as the
# only file allowed to hold that default. AllowOverride All keeps
# backend/.htaccess in charge of routing and the Authorization header.
<Directory /var/www/html/gpt>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

DirectoryIndex index.html index.php
ServerTokens Prod
ServerSignature Off

# backend/.htaccess only rewrites to index.php when REQUEST_FILENAME !-f, and
# a dotfile like backend/.env IS a file -- that rewrite guard is not a deny,
# so Apache serves it as a plain static file, secrets and all. Apache's own
# default dotfile deny (<FilesMatch "^\.ht">) covers .htaccess/.htpasswd only,
# not .env. Deny every dotfile explicitly instead of relying on either.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
