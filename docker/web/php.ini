; backend/.htaccess sets these inside <IfModule mod_php.c>, whose module name
; varies across PHP builds. Setting them here too means the limits hold either
; way. 60M matches the per-file cap ChatAttachmentController enforces.
upload_max_filesize = 60M
post_max_size = 60M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
expose_php = Off
